<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
        }

        h1 {
            font-size: 40px;
        }

        #count {
            font-size: 60px;
            margin: 30px;
        }

        button {
            padding: 12px 25px;
            margin: 5px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
        }

        .increase {
            background: green;
            color: white;
        }

        .decrease {
            background: red;
            color: white;
        }

        .reset {
            background: black;
            color: white;
        }
    </style>
</head>

<body>

    <h1>Counter App</h1>

    <div id="count">0</div>

    <button class="decrease" onclick="decrease()">−</button>
    <button class="reset" onclick="reset()">Reset</button>
    <button class="increase" onclick="increase()">+</button>

    <script>
        let count = 0;

        function increase() {
            count++;
            document.getElementById("count").innerText = count;
        }

        function decrease() {
            count--;
            document.getElementById("count").innerText = count;
        }

        function reset() {
            count = 0;
            document.getElementById("count").innerText = count;
        }
    </script>

</body>
</html>
