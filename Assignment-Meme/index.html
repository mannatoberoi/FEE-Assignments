<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Meme</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Every Coding Student 😂</h1>
    <div class="meme">
        <div class="face">
            <div class="eyes">
                <span>👀</span>
            </div>
            <div class="mouth" id="emoji">
                😎
            </div>
        </div>
        <div class="code-box">
            <p id="text">
                Code Works Perfectly ✅
            </p>
        </div>
        <button onclick="changeMeme()">
            Run Code
        </button>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
